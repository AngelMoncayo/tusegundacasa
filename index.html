        <div style={{display:'flex',justifyContent:'center',gap:10,marginTop:56}}>
          {t.respira.words.map((_,i)=>(

    </section>
  );
}

        <div style={{textAlign:'center',marginBottom:56}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)',marginBottom:14}}>{t.faq.kicker}</div>
          <h2 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:54,lineHeight:1,margin:0,color:'var(--moss)',letterSpacing:-1}}>{t.faq.h2}</h2>
        </div>
        <div>
          {t.faq.qs.map(([q,a],i)=>(
            <div key={i} style={{borderBottom:'1px solid var(--line)'}}>
              <button onClick={()=>setOpen(open===i?-1:i)} style={{
                width:'100%',padding:'24px 0',background:'transparent',border:'none',cursor:'pointer',
                display:'flex',justifyContent:'space-between',alignItems:'center',textAlign:'left',gap:16,
                fontFamily:'var(--display)',fontSize:22,color:'var(--moss)',
              }}>
                <span>{q}</span>
                <span style={{fontFamily:'var(--display)',fontSize:24,color:'var(--gold)',transition:'transform .2s',transform:open===i?'rotate(45deg)':'rotate(0)'}}>+</span>
              </button>
              {open===i && (
                <div style={{paddingBottom:24,fontSize:15,lineHeight:1.7,color:'rgba(26,28,22,0.78)',maxWidth:680}}>{a}</div>
              )}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ---------- FOOTER ----------
function Footer() {
  const {t} = useT();
  return (
    <footer style={{background:'var(--moss-deep)',color:'var(--cream)',padding:'72px 48px 32px'}}>
      <div style={{maxWidth:1320,margin:'0 auto'}}>
        <div className="footer-grid" style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:56,marginBottom:56}}>
          <div>
            <img src="logo.png" alt="" style={{width:120,height:140,objectFit:'cover',borderRadius:8,marginBottom:18}}/>
            <p style={{fontSize:13,lineHeight:1.7,opacity:0.7,maxWidth:280,margin:0,whiteSpace:'pre-line'}}>{t.footer.tagline}</p>
          </div>
          {t.footer.cols.map(([h,items])=>(
            <div key={h}>
              <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:2,textTransform:'uppercase',color:'var(--gold-soft)',marginBottom:16}}>{h}</div>
              <ul style={{listStyle:'none',padding:0,margin:0,display:'flex',flexDirection:'column',gap:10}}>
                {items.map(([label,href])=>(
                  <li key={label} style={{fontSize:13,opacity:0.85}}>
                    <a href={href} target={href.startsWith('http')||href.startsWith('mailto')?'_blank':undefined} rel="noreferrer" style={{color:'inherit',textDecoration:'none'}}>{label}</a>
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>
        <div className="cta-bar" style={{paddingTop:24,borderTop:'1px solid rgba(236,228,211,0.15)',display:'flex',justifyContent:'space-between',fontFamily:'var(--mono)',fontSize:10,letterSpacing:1.5,opacity:0.5,gap:16,flexWrap:'wrap'}}>
          <span>{t.footer.copyright}</span>
          <span>{t.footer.made}</span>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const [lang,setLang] = useState(()=>{
    try { return localStorage.getItem('lcds_lang') || 'EN'; } catch(e){ return 'EN'; }
  });
  useEffect(()=>{
    try { localStorage.setItem('lcds_lang', lang); } catch(e){}
    document.documentElement.lang = lang.toLowerCase();
  },[lang]);
  const value = { lang, setLang, t: STRINGS[lang] };
  return (
    <LangCtx.Provider value={value}>
      <Nav/>
      <Hero/>
      <Respira/>
      <Marquee/>
      <Sobre/>
      <Habitaciones/>
      <Experiencias/>
      <Piscina/>
      <Spa/>
      <Aves/>
      <Comida/>
      <Galeria/>
      <Testimonios/>
      <Reserva/>
      <Ubicacion/>
      <Souvenirs/>
      <FAQ/>
      <Footer/>
    </LangCtx.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
