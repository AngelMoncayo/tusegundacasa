<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La Casa de Sammy — Vilcabamba</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --moss:#2f3a2c;       /* tomado del fondo del logo */
    --moss-deep:#232b21;
    --fern:#4a5e3a;
    --bone:#ece4d3;
    --cream:#f5efe1;
    --gold:#a98a4d;       /* tomado del "Sammy" del logo */
    --gold-soft:#c8a766;
    --clay:#b56a3f;
    --ink:#1a1c16;
    --line:rgba(47,58,44,0.18);
    --display:'Fraunces', 'Cormorant Garamond', Georgia, serif;
    --display-it:'Cormorant Garamond', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:var(--sans);}

</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>

<script type="text/babel">
const { useState } = React;

// ---------- NAV ----------
function Nav() {
  const [lang, setLang] = useState('ES');
  return (
    <header style={{
      position:'sticky', top:0, zIndex:50,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      padding:'14px 48px', background:'rgba(245,239,225,0.92)', backdropFilter:'blur(10px)',
      borderBottom:'1px solid var(--line)',
    }}>
      <a href="#" style={{display:'flex',alignItems:'center',gap:12,textDecoration:'none',color:'var(--ink)'}}>
        <img src="logo.png" alt="" style={{width:44,height:52,objectFit:'cover',borderRadius:6}}/>
        <div style={{lineHeight:1}}>
          <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:-0.3}}>La Casa de Sammy</div>
          <div style={{fontFamily:'var(--display-it)',fontStyle:'italic',fontSize:12,color:'var(--gold)',marginTop:2}}>tu segunda casa</div>
        </div>
      </a>
      <nav style={{display:'flex',gap:34,fontSize:13,color:'var(--moss)'}}>
        <a href="#sobre" style={navL}>Sobre</a>
        <a href="#habitaciones" style={navL}>Habitaciones</a>
        <a href="#experiencias" style={navL}>Experiencias</a>
        <a href="#galeria" style={navL}>Galería</a>
        <a href="#ubicacion" style={navL}>Cómo llegar</a>
      </nav>
      <div style={{display:'flex',gap:14,alignItems:'center'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:1.5,cursor:'pointer'}}>
          <span onClick={()=>setLang('ES')} style={{color:lang==='ES'?'var(--moss)':'rgba(0,0,0,0.4)',fontWeight:lang==='ES'?600:400}}>ES</span>
          <span style={{margin:'0 6px',opacity:0.4}}>·</span>
          <span onClick={()=>setLang('EN')} style={{color:lang==='EN'?'var(--moss)':'rgba(0,0,0,0.4)',fontWeight:lang==='EN'?600:400}}>EN</span>
        </div>
        <a href="#reservar" style={{
          background:'var(--moss)', color:'var(--cream)', padding:'11px 22px',
          borderRadius:999, fontSize:12, fontWeight:500, textDecoration:'none',letterSpacing:0.3,
        }}>Reservar</a>
      </div>
    </header>
  );
}
const navL = {color:'inherit',textDecoration:'none'};

// ---------- HERO ----------
function Hero() {
  return (
    <section style={{padding:'72px 48px 90px', background:'var(--cream)'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:56,alignItems:'center',maxWidth:1320,margin:'0 auto'}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:28}}>
            <span style={{width:36,height:1,background:'var(--gold)'}}/>
            <span style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)'}}>
              Vilcabamba · Loja · Ecuador
            </span>
          </div>
          <h1 style={{
            fontFamily:'var(--display)',fontWeight:400,fontSize:96,lineHeight:0.97,margin:0,
            letterSpacing:-2.5,color:'var(--moss)',textWrap:'balance',
          }}>
            Tu segunda casa<br/>en el <em style={{fontFamily:'var(--display-it)',color:'var(--gold)',fontStyle:'italic',fontWeight:400}}>Valle Sagrado</em>.
          </h1>
          <p style={{fontSize:18,lineHeight:1.65,marginTop:32,color:'rgba(26,28,22,0.78)',maxWidth:500}}>
            Una casa de campo para grupos familiares en el corazón del Valle de la Longevidad. Cinco habitaciones, huerto propio, cabalgatas al Mandango y todo el silencio del sur del Ecuador.
          </p>
          <div style={{display:'flex',gap:12,marginTop:40}}>
            <a href="#reservar" style={btnPrimary}>Ver disponibilidad →</a>
            <a href="#sobre" style={btnGhost}>Conocer la casa</a>
          </div>
          <div style={{display:'flex',gap:48,marginTop:64,paddingTop:28,borderTop:'1px solid var(--line)'}}>
            {[['1.500','m.s.n.m.'],['18-22°','todo el año'],['5','habitaciones'],['12','huéspedes']].map(([n,l])=>(
              <div key={l}>
                <div style={{fontFamily:'var(--display)',fontSize:30,color:'var(--moss)',lineHeight:1}}>{n}</div>
                <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:1.5,textTransform:'uppercase',color:'rgba(26,28,22,0.55)',marginTop:6}}>{l}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{position:'relative',height:660}}>
          <div style={{position:'absolute',top:0,right:0,width:'88%',height:480,borderRadius:'50% 50% 8px 8px / 60% 60% 8px 8px',overflow:'hidden'}}>
            <Photo src="pic1.jpeg" label="vista del valle desde la casa" ratio="auto" style={{height:'100%'}}/>
          </div>
          <div style={{position:'absolute',bottom:0,left:0,width:'62%',height:290,overflow:'hidden',boxShadow:'0 14px 32px rgba(0,0,0,0.18)',borderRadius:4}}>
            <Photo src="pic2.jpeg" label="piscina con vista al valle" ratio="auto" style={{height:'100%'}}/>
          </div>
          <div style={{position:'absolute',bottom:30,right:-8,width:230,padding:'20px 22px',background:'var(--moss)',color:'var(--cream)',borderRadius:4,boxShadow:'0 14px 32px rgba(0,0,0,0.22)'}}>
            <div style={{fontFamily:'var(--display-it)',fontStyle:'italic',fontSize:17,lineHeight:1.4}}>
              "Vilcabamba — donde se le suman años a la vida."
            </div>
            <div style={{fontFamily:'var(--mono)',fontSize:9,letterSpacing:1.5,textTransform:'uppercase',color:'var(--gold-soft)',marginTop:12}}>
              Dicho del valle
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}
const btnPrimary = {background:'var(--moss)',color:'var(--cream)',padding:'16px 26px',borderRadius:999,fontSize:13,fontWeight:500,textDecoration:'none',display:'inline-block'};
const btnGhost   = {background:'transparent',color:'var(--moss)',border:'1px solid var(--moss)',padding:'15px 26px',borderRadius:999,fontSize:13,fontWeight:500,textDecoration:'none',display:'inline-block'};

// ---------- MARQUEE ----------
function Marquee() {
  const ANDEAN = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='M20 4 L36 20 L20 36 L4 20 Z' fill='none' stroke='%23ece4d3' stroke-width='0.5' opacity='0.3'/></svg>")`;
  return (
    <div style={{background:'var(--moss)',color:'var(--cream)',padding:'24px 0',overflow:'hidden',backgroundImage:ANDEAN}}>
      <div style={{display:'flex',gap:48,fontFamily:'var(--display-it)',fontStyle:'italic',fontSize:26,whiteSpace:'nowrap'}}>
        {Array(2).fill(0).map((_,i)=>(
          <React.Fragment key={i}>
            <span>· Valle Sagrado</span>
            <span style={{color:'var(--gold-soft)'}}>· Aire puro</span>
            <span>· Río Chamba</span>
            <span style={{color:'var(--gold-soft)'}}>· Cerro Mandango</span>
            <span>· Cascada El Palto</span>
            <span style={{color:'var(--gold-soft)'}}>· Café de Loja</span>
            <span>· Bosque nublado</span>
            <span style={{color:'var(--gold-soft)'}}>· Mesa larga</span>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

// ---------- SOBRE ----------
function Sobre() {
  return (
    <section id="sobre" style={{padding:'120px 48px',background:'var(--cream)',maxWidth:1320,margin:'0 auto'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1.5fr',gap:80}}>
        <div style={{position:'sticky',top:100,alignSelf:'start'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)',marginBottom:18}}>
            01 / Sobre la casa
          </div>
          <h2 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:54,lineHeight:1,margin:0,color:'var(--moss)',letterSpacing:-1}}>
            Una casa con<br/>raíces hondas.
          </h2>
          <Photo src="pic3.jpeg" label="cabaña entre el jardín" ratio="4/5" style={{marginTop:32, borderRadius:4}}/>
        </div>
        <div style={{paddingTop:24}}>
          <p style={{fontFamily:'var(--display)',fontSize:26,lineHeight:1.4,fontWeight:400,margin:'0 0 32px',color:'var(--moss)',textWrap:'pretty'}}>
            La Casa de Sammy abre sus puertas en uno de los rincones más tranquilos del Ecuador, declarado <em style={{color:'var(--gold)'}}>Rincón Mágico</em> en 2023.
          </p>
          <p style={{fontSize:16,lineHeight:1.75,color:'rgba(26,28,22,0.78)',marginBottom:18}}>
            La casa fue levantada en piedra del río y madera local, pensada para albergar a familias que viajan juntas. Cada habitación mira a un costado distinto del valle, y todas comparten el patio central, el comedor abierto y la huerta.
          </p>
          <p style={{fontSize:16,lineHeight:1.75,color:'rgba(26,28,22,0.78)',marginBottom:36}}>
            Lo que sirvieron en la mesa esta mañana viene del huerto. Los recorridos los hacen guías que crecieron en el valle. Y el wifi, prometemos, llega a casi todos los rincones — aunque mejor lo apagas un rato.
          </p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginTop:32}}>
            {[
              ['Huerto propio','Verduras, hierbas y huevos del día.'],
              ['Familias','Cuartos comunicados y zonas para niños.'],
              ['Guías locales','Cabalgatas, senderismo y termales.'],
              ['Pet friendly','Tu perro también es bienvenido.'],
            ].map(([t,d])=>(
              <div key={t} style={{padding:'20px 22px',background:'var(--bone)',borderRadius:4}}>
                <div style={{fontFamily:'var(--display)',fontSize:20,color:'var(--moss)',marginBottom:6}}>{t}</div>
                <div style={{fontSize:13,lineHeight:1.5,color:'rgba(26,28,22,0.7)'}}>{d}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

// ---------- HABITACIONES ----------
function Habitaciones() {
  const rooms = [
    { name:'Mandango', tag:'Suite familiar', cap:'4 huéspedes', price:'$120', src:'pic4.jpeg', pos:'center' },
    { name:'Wilco',    tag:'Doble matrim.',  cap:'2 huéspedes', price:'$85',  src:'pic12.jpeg', pos:'center' },
    { name:'Chamba',   tag:'Familiar',       cap:'3 huéspedes', price:'$95',  src:'pic10.jpeg', pos:'center' },
    { name:'Palto',    tag:'Doble',          cap:'2 huéspedes', price:'$80',  src:'pic8.jpeg', pos:'center' },
  ];
  return (
    <section id="habitaciones" style={{padding:'110px 0 110px 48px',background:'var(--bone)'}}>
      <div style={{maxWidth:1320,margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',paddingRight:48,marginBottom:48}}>
          <div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)',marginBottom:14}}>
              02 / Habitaciones
            </div>
            <h2 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:60,lineHeight:0.95,margin:0,color:'var(--moss)',letterSpacing:-1}}>
              Cinco cuartos,<br/>nombrados como el valle.
            </h2>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button style={{width:44,height:44,borderRadius:'50%',border:'1px solid var(--moss)',background:'transparent',color:'var(--moss)',cursor:'pointer',fontSize:16}}>←</button>
            <button style={{width:44,height:44,borderRadius:'50%',border:'none',background:'var(--moss)',color:'var(--cream)',cursor:'pointer',fontSize:16}}>→</button>
          </div>
        </div>
        <div style={{display:'flex',gap:24,overflowX:'auto',paddingBottom:8,paddingRight:48}}>
          {rooms.map(r=>(
            <div key={r.name} style={{flex:'0 0 300px',background:'var(--cream)',borderRadius:6,overflow:'hidden'}}>
              <Photo src={r.src} label={r.name} ratio="3/4" position={r.pos}/>
              <div style={{padding:'20px 22px'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:1.8,textTransform:'uppercase',color:'var(--gold)'}}>{r.tag}</div>
                <h3 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:30,margin:'6px 0 0',color:'var(--moss)'}}>{r.name}</h3>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:18,paddingTop:16,borderTop:'1px solid var(--line)'}}>
                  <span style={{fontSize:12,color:'rgba(26,28,22,0.6)'}}>{r.cap}</span>
                  <span style={{fontFamily:'var(--display)',fontSize:20,color:'var(--moss)'}}>{r.price}<span style={{fontSize:11,color:'rgba(26,28,22,0.5)'}}> /noche</span></span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ---------- EXPERIENCIAS ----------
function Experiencias() {
  const items = [
    ['01','Cabalgatas','Rutas guiadas al cerro Mandango y la cascada El Palto.','pic9.jpeg'],
    ['02','Senderismo','Reserva Rumi Wilco, doce senderos entre bosque nublado.','pic6.jpeg'],
    ['03','Piscina','Refrescarse mirando los cerros — el lujo más simple.','pic2.jpeg'],
    ['04','Mesa larga','Cenas familiares con productos del huerto y café lojano.','pic7.jpeg'],
  ];
  return (
    <section id="experiencias" style={{padding:'120px 48px',background:'var(--moss-deep)',color:'var(--cream)'}}>
      <div style={{maxWidth:1320,margin:'0 auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:48,alignItems:'end',marginBottom:64}}>
          <div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold-soft)',marginBottom:14}}>
              03 / Para hacer
            </div>
            <h2 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:64,lineHeight:1,margin:0,letterSpacing:-1,color:'var(--cream)'}}>
              El valle es tu<br/>segunda casa.
            </h2>
          </div>
          <p style={{fontSize:16,lineHeight:1.7,opacity:0.8,margin:0}}>
            Cada mañana hay una propuesta nueva en la pizarra del comedor. Te apuntas si quieres, o te quedas leyendo en la hamaca.
          </p>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gap:20}}>
          {items.map(([n,t,d,src])=>(
            <div key={n}>
              <Photo src={src} label={t} ratio="3/4"/>
              <div style={{paddingTop:18}}>
                <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--gold-soft)',marginBottom:8}}>{n}</div>
                <h4 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:24,margin:'0 0 8px',color:'var(--cream)'}}>{t}</h4>
                <p style={{fontSize:13,lineHeight:1.6,opacity:0.72,margin:0}}>{d}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

      <div style={{maxWidth:1320,margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:40}}>
          <div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)',marginBottom:14}}>04 / Galería</div>

          <a href="#" style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'var(--gold)',borderBottom:'1px solid var(--gold)',paddingBottom:4,textDecoration:'none'}}>

        <div style={{display:'grid',gridTemplateColumns:'repeat(4, 1fr)',gridAutoRows:180,gap:16}}>

// ---------- FAQ ----------
function FAQ() {
  const [open,setOpen]=useState(0);
  const qs = [
    ['¿Cuál es la estadía mínima?','Dos noches en temporada regular, tres en feriados.'],
    ['¿Reciben mascotas?','Sí, perros bienvenidos con previo aviso. Hay zonas verdes amplias.'],
    ['¿Incluye desayuno?','Sí. Desayuno casero con productos del huerto, café de Loja y pan recién horneado.'],
    ['¿Hay wifi?','Sí, en todas las áreas comunes y en la mayoría de habitaciones.'],
    ['¿Pueden organizar excursiones?','Coordinamos cabalgatas, caminatas guiadas a Mandango y Rumi Wilco, y traslados a las termales.'],
    ['¿Aceptan tarjeta?','Sí. También transferencia bancaria local y efectivo.'],
  ];
  return (
    <section style={{padding:'110px 48px',background:'var(--bone)'}}>
      <div style={{maxWidth:980,margin:'0 auto'}}>
        <div style={{textAlign:'center',marginBottom:56}}>
          <div style={{fontFamily:'var(--mono)',fontSize:11,letterSpacing:2.5,textTransform:'uppercase',color:'var(--gold)',marginBottom:14}}>08 / Preguntas</div>
          <h2 style={{fontFamily:'var(--display)',fontWeight:400,fontSize:54,lineHeight:1,margin:0,color:'var(--moss)',letterSpacing:-1}}>
            Lo que la gente nos pregunta.
          </h2>
        </div>
        <div>
          {qs.map(([q,a],i)=>(
            <div key={q} style={{borderBottom:'1px solid var(--line)'}}>
              <button onClick={()=>setOpen(open===i?-1:i)} style={{
                width:'100%',padding:'24px 0',background:'transparent',border:'none',cursor:'pointer',
                display:'flex',justifyContent:'space-between',alignItems:'center',textAlign:'left',
                fontFamily:'var(--display)',fontSize:22,color:'var(--moss)',
              }}>
                <span>{q}</span>
                <span style={{fontFamily:'var(--display)',fontSize:24,color:'var(--gold)',transition:'transform .2s',transform:open===i?'rotate(45deg)':'rotate(0)'}}>+</span>
              </button>
              {open===i && (
                <div style={{paddingBottom:24,fontSize:15,lineHeight:1.7,color:'rgba(26,28,22,0.78)',maxWidth:680}}>{a}</div>
              )}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}
